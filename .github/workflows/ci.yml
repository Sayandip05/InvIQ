name: InvIQ CI (Continuous Integration)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Test Suite ──────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Quality Gating
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: testing
      DATABASE_URL: sqlite:///file:memdb_ci?mode=memory&cache=shared&uri=true
      SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

      # External services disabled in CI (mocked or fallback active)
      REDIS_ENABLED: "false"
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      QDRANT_ENABLED: "false"
      QDRANT_URL: ""
      QDRANT_API_KEY: ""
      SMTP_ENABLED: "false"
      LANGCHAIN_TRACING_V2: "false"
      LANGCHAIN_API_KEY: ""
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      SARVAM_API_KEY: ""

      # Test accounts & rate limits
      ADMIN_EMAIL: admin@test.local
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: testpassword123
      ADMIN_FULL_NAME: CI Test Administrator
      RATE_LIMIT_DEFAULT: "600/minute"
      RATE_LIMIT_AUTH: "60/minute"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Lint Checks (Diagnostic)
        run: |
          ruff check backend/app --exit-zero

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          python -m pytest tests/ \
            --tb=short \
            -v \
            --disable-warnings
