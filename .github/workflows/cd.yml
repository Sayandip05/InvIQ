name: InvIQ CD (Continuous Deployment)

on:
  workflow_dispatch: # Manual trigger only — automated CD checks disabled
  # workflow_run:
  #   workflows: ["InvIQ CI (Continuous Integration)"]
  #   types:
  #     - completed
  #   branches:
  #     - main

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets."
            echo "Skipping webhook trigger. (Render will deploy automatically via native Git push if Auto-Deploy is enabled)."
            exit 0
          fi

          echo "Triggering Render deployment webhook..."
          curl -X POST "$RENDER_HOOK" \
            --fail \
            --silent \
            --show-error
          echo "Render deployment triggered successfully"
