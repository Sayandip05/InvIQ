# ── Docker Compose: InvIQ Local Development Environment ───────────────────────
# Stack:
#   1. db: Local PostgreSQL 15
#   2. redis: Local Redis 7
#   3. app: FastAPI Web API (REST, GraphQL, WebSockets)
#   4. celery_worker: Background task runner
#   5. celery_beat: Periodic scheduler (FEFO 6h, stock 1h, cold-chain 30m)
#
# Usage (Development):
#   docker compose up -d                  → start entire local development stack
#   docker compose logs -f app            → tail API logs
#   docker compose logs -f celery_worker  → tail worker logs
#   docker compose logs -f celery_beat    → tail scheduler logs
#   docker compose down                   → stop local development stack
#   docker compose down -v                → stop and remove local database volumes

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  PROJECT_NAME: "Smart Inventory Assistant"
  
  # Database (Local PostgreSQL)
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/inviq_dev}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  
  # Redis / Celery Broker (Local Redis)
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_ENABLED: ${REDIS_ENABLED:-true}
  
  # Frontend & CORS
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
  
  # AI / LLM (Groq)
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
  
  # Gemini Embeddings & Vector Store (Qdrant)
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  QDRANT_ENABLED: ${QDRANT_ENABLED:-false}
  QDRANT_URL: ${QDRANT_URL:-}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chat_memory}
  
  # Sarvam AI (Voice / STT)
  SARVAM_API_KEY: ${SARVAM_API_KEY:-}
  
  # Security
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-32-chars-minimum-length}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  
  # Login Lockout
  MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
  LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-15}
  
  # Admin Accounts
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inventory.local}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
  ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
  
  # Rate Limiting
  RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-60/minute}
  RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-5/minute}
  
  # SMTP (Email Notifications)
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-InvIQ Smart Inventory}
  
  # Google OAuth
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  
  # Storage
  AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-inviq-documents}
  AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
  AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}

services:
  # ── 1. Local PostgreSQL Database ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: inviq_dev_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-inviq_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inviq_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inviq_network

  # ── 2. Local Redis Cache & Broker ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: inviq_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inviq_network

  # ── 3. FastAPI Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inviq_dev_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env

    volumes:
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    
    networks:
      - inviq_network

  # ── 4. Celery Worker (Asynchronous Task Processing Engine) ────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inviq_dev_celery_worker
    restart: unless-stopped
    command: ["/venv/bin/celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    working_dir: /app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      <<: *backend-env
    volumes:
      - ./logs:/app/logs
    networks:
      - inviq_network

  # ── 5. Celery Beat (Periodic Job Scheduler) ───────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inviq_dev_celery_beat
    restart: unless-stopped
    command: ["/venv/bin/celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    working_dir: /app/backend
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    environment:
      <<: *backend-env
    volumes:
      - ./logs:/app/logs
    networks:
      - inviq_network

# ── Volumes & Networks ─────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  inviq_network:
    driver: bridge
